<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập – Quản lý Bán hàng</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { width: 380px; border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.1); }
  .login-header { background: #1a2f4e; border-radius: 16px 16px 0 0; padding: 2rem; text-align: center; color: white; }
</style>
</head>
<body>
<div class="card login-card">
  <div class="login-header">
    <i class="bi bi-shop-window fs-1"></i>
    <h5 class="mt-2 mb-0 fw-bold">Quản lý Bán hàng</h5>
    <div class="text-white-50 small">Đăng nhập để tiếp tục</div>
  </div>
  <div class="card-body p-4">
    {% if error %}
    <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">Số điện thoại</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-phone"></i></span>
          <input name="soDienThoai" class="form-control" placeholder="0911000001" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Mật khẩu</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input name="matKhau" type="password" class="form-control" placeholder="Nhập mật khẩu" required>
        </div>
        <div class="text-muted small mt-1">Mật khẩu mặc định = số điện thoại</div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập
      </button>
    </form>
  </div>
</div>
</body>
</html>
